networks:
  dns-net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend-net:

services:
  dns:
    image: coredns/coredns
    networks:
      dns-net:
        ipv4_address: 172.28.0.10
    volumes:
      - ../Corefile:/Corefile
    command: ["-conf", "/Corefile"]

  backend:
    image: nginx:alpine
    networks:
      - backend-net

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    networks:
      dns-net:
        ipv4_address: 172.28.0.20
      backend-net:
    command: >
      vaydns-server -udp :53
      -domain t.example.com -upstream backend:80 ${RECORD_TYPE_FLAG:-}
    depends_on:
      dns:
        condition: service_started

  client:
    build:
      context: ../..
      dockerfile: Dockerfile
    networks:
      - dns-net
    command: >
      vaydns-client -udp 172.28.0.10:53
      -domain t.example.com -listen 0.0.0.0:7000 ${RECORD_TYPE_FLAG:-}
    depends_on:
      server:
        condition: service_started
