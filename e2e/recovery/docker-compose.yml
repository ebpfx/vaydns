networks:
  dns-net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend-net:

services:
  dns:
    image: coredns/coredns
    networks:
      dns-net:
        ipv4_address: 172.28.0.10
    volumes:
      - ../Corefile:/Corefile
    command: ["-conf", "/Corefile"]

  socks:
    image: serjs/go-socks5-proxy
    environment:
      - PROXY_USER=user
      - PROXY_PASSWORD=pass
    networks:
      - backend-net

  heavy:
    image: nginx:alpine
    networks:
      - backend-net
    entrypoint:
      - sh
      - -c
      - |
        dd if=/dev/urandom of=/usr/share/nginx/html/bigfile bs=1M count=10
        exec nginx -g 'daemon off;'

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    networks:
      dns-net:
        ipv4_address: 172.28.0.30
      backend-net:
    command: >
      vaydns-server -udp :53
      -domain s.example.com -upstream socks:1080
      -idle-timeout 30s -keepalive 5s
    depends_on:
      dns:
        condition: service_started
      socks:
        condition: service_started

  client:
    build:
      context: ../..
      dockerfile: Dockerfile
    networks:
      - dns-net
    command: >
      vaydns-client -udp 172.28.0.10:53
      -domain s.example.com -listen 0.0.0.0:7000
      -idle-timeout 30s -keepalive 5s
      -reconnect-min 1s -reconnect-max 5s
    depends_on:
      server:
        condition: service_started
